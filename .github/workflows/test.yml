name: Check and Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        run: |
          moon version --all
          moon update

      - name: Format
        run: moon fmt --check

      - name: Check all targets
        run: moon check --deny-warn --target all

      - name: Test all targets
        run: moon test --deny-warn --target all

      - name: Coverage
        run: |
          moon test --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze

      - name: Public interface and clean tree
        run: |
          moon info
          git diff --exit-code
