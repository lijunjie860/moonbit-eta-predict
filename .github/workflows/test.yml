name: Check and Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          moon version --all
          moon update
          version="$(moonc -v | sed -n 's/.*v\([0-9][0-9]*\)\.\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1 \2 \3/p')"
          set -- $version
          if [ "$#" -ne 3 ]; then
            echo "Unable to parse MoonBit compiler version" >&2
            exit 1
          fi
          if [ "$1" -eq 0 ] && { [ "$2" -lt 10 ] || { [ "$2" -eq 10 ] && [ "$3" -lt 9 ]; }; }; then
            echo "MoonBit compiler v0.10.9 or newer is required" >&2
            exit 1
          fi

      - name: Toolchain on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          moon version --all
          moon update
          $match = (moonc -v | Select-String -Pattern 'v(\d+)\.(\d+)\.(\d+)').Matches
          if ($null -eq $match) { throw "Unable to parse MoonBit compiler version" }
          $major = [int]$match.Groups[1].Value
          $minor = [int]$match.Groups[2].Value
          $patch = [int]$match.Groups[3].Value
          if (($major -lt 0) -or (($major -eq 0) -and ($minor -lt 10)) -or (($major -eq 0) -and ($minor -eq 10) -and ($patch -lt 9))) {
            throw "MoonBit compiler v0.10.9 or newer is required"
          }

      - name: Format
        run: moon fmt --check

      - name: Check all targets
        run: moon check --deny-warn --target all

      - name: Test all targets
        run: moon test --deny-warn --target all

      - name: Coverage
        run: |
          moon test --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze

      - name: Public interface and clean tree
        run: |
          moon info
          git diff --exit-code
