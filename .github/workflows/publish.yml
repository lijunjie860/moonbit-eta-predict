name: Publish Mooncakes package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Prepublish checks
        run: |
          moon version --all
          moon update
          version="$(moonc -v | sed -n 's/.*v\([0-9][0-9]*\)\.\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1 \2 \3/p')"
          set -- $version
          if [ "$#" -ne 3 ]; then
            echo "Unable to parse MoonBit compiler version" >&2
            exit 1
          fi
          if [ "$1" -eq 0 ] && { [ "$2" -lt 10 ] || { [ "$2" -eq 10 ] && [ "$3" -lt 9 ]; }; }; then
            echo "MoonBit compiler v0.10.9 or newer is required" >&2
            exit 1
          fi
          moon fmt --check
          moon check --deny-warn --target all
          moon test --deny-warn --target all
          moon info
          git diff --exit-code

      - name: Publish
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_CREDENTIALS }}
        run: |
          if [ -z "$MOONCAKES_CREDENTIALS" ]; then
            echo "MOONCAKES_CREDENTIALS is not configured" >&2
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$MOONCAKES_CREDENTIALS" > "$HOME/.moon/credentials.json"
          moon publish
          rm -f "$HOME/.moon/credentials.json"
